name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc -p tsconfig.json
      - run: npm test

  wasm:
    # Proves the committed ggwave build comes from the pinned, hash-checked sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - run: bash packages/ggwave-wasm/build.sh
      - name: Rebuilt output matches committed dist
        run: git diff --exit-code -- packages/ggwave-wasm/dist ':!packages/ggwave-wasm/dist/BUILD_INFO'
